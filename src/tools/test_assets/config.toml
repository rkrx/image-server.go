enableLogging = true
hashCacheFilenames = true
secret = "leave-a-random-string-here"

[server]
listenAddr = "0.0.0.0:8080"
originalBackend = "https://127.0.0.1/original"

[jpegDefaults]
quality = 85

[webpDefaults]
quality = 80
lossless = true

[avifDefaults]
quality = 55
alphaQuality = 75
speed = 8

[[profile]]
name = "500px"
width = 500
height = 500

[[profile]]
name = "250px"
width = 250
height = 250
sharpen = 0.6
autocrop = {tolerance = 15, border = 3}
